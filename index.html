<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MasGuntoro WA - Final Fix</title>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
<script src="https://download.agora.io/sdk/release/AgoraRTM_N.js"></script>
<style>
html, body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;overscroll-behavior:none;background:#111b21}
*{box-sizing:border-box}
body{font-family:Arial;display:flex;flex-direction:column}
.header{height:62px;min-height:62px;background:#fff;display:flex;align-items:center;padding:0 8px;gap:10px;flex-shrink:0;border-bottom:1px solid #eee}
.top-ico{width:26px;height:26px;object-fit:contain;cursor:pointer;flex-shrink:0;border-radius:50%}
.avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;background:#ddd;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:16px}
.chat-area{flex:1;background:#e5ddd5 url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:12px 8px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:8px 10px;border-radius:8px;font-size:14px;background:#fff;box-shadow:0 1px 1px #0002;word-break:break-word}
.me{align-self:flex-end;background:#d9fdd3}
.time{font-size:10px;color:#667781;float:right;margin:6px 0 0 8px}

/* === FIX INPUT BIAR GAK KELUAR KOLOM === */
.input-bar{height:62px;min-height:62px;padding:6px 8px;background:#f0f2f5;display:flex;align-items:center;gap:6px;flex-shrink:0}
.input-box{flex:1;background:#fff;border-radius:25px;display:flex;align-items:center;padding:5px 10px 5px 12px;gap:6px;min-width:0;overflow:hidden}
.input-box input{flex:1;width:0;min-width:0;border:none;outline:none;font-size:15px;padding:8px 0;background:transparent}
.ico{width:24px;height:24px;min-width:24px;min-height:24px;object-fit:contain;cursor:pointer;border-radius:50%;flex-shrink:0;display:block}
.mic-foto{width:46px;height:46px;min-width:46px;border-radius:50%;object-fit:cover;background:#00a884;padding:7px;cursor:pointer;flex-shrink:0;transition:0.2s}

#emojiPanel{position:absolute;bottom:62px;left:0;right:0;background:#fff;height:200px;overflow-y:auto;padding:10px;display:none;z-index:30;border-top:1px solid #ddd}
#emojiPanel span{font-size:26px;padding:6px;cursor:pointer;display:inline-block}
#callScreen{position:fixed;inset:0;background:#0a332c;z-index:100;display:none;flex-direction:column}
#remoteVideo{flex:1;background:#111;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
#localVideo{position:absolute;bottom:90px;right:15px;width:110px;height:160px;background:#333;border-radius:12px;overflow:hidden;border:2px solid #fff;z-index:2}
.call-controls{height:80px;background:#0006;display:flex;align-items:center;justify-content:center;gap:25px}
.call-btn{width:55px;height:55px;border-radius:50%;border:none;cursor:pointer;font-size:22px}
.end-call{background:#ff3b30;color:#fff}
#joinModal{position:fixed;inset:0;background:#000c;z-index:99;display:flex;align-items:center;justify-content:center}
.join-card{background:#fff;padding:20px;border-radius:12px;width:85%;max-width:300px;text-align:center}
.join-card input{width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:8px}
.join-card button{width:100%;padding:12px;background:#00a884;color:#fff;border:none;border-radius:8px;margin-top:10px;font-weight:bold}
</style>
</head>
<body>

<div class="header">
  <img class="top-ico" id="top1" src="img/panah.png" onerror="this.src='https://chatvideocall1.netlify.app/img/panah.png'">
  <div class="avatar"><img src="img/avatar.png" onerror="this.src='https://picsum.photos/100'"></div>
  <div class="name" id="roomTitle">ruang-tes-123</div>
  <div class="top-right">
    <img class="top-ico" id="top3" src="img/video.png" onerror="this.src='https://chatvideocall1.netlify.app/img/video.png'">
    <img class="top-ico" id="top4" src="img/telpon.png" onerror="this.src='https://chatvideocall1.netlify.app/img/telpon.png'">
    <img class="top-ico" id="top5" src="img/titik3.png" onerror="this.src='https://chatvideocall1.netlify.app/img/titik3.png'">
  </div>
</div>

<div class="chat-area" id="msgs"></div>
<div id="emojiPanel"></div>

<div id="callScreen">
  <div id="remoteVideo">Menunggu teman...</div>
  <div id="localVideo"></div>
  <div class="call-controls">
    <button class="call-btn end-call" id="endCallBtn">📞</button>
  </div>
</div>

<div class="input-bar">
  <div class="input-box">
    <img class="ico" id="icon1" src="img/imot.png" onerror="this.src='https://chatvideocall1.netlify.app/img/imot.png'">
    <input id="txt" placeholder="Ketik pesan">
    <img class="ico" id="icon2" src="img/file.png" onerror="this.src='https://chatvideocall1.netlify.app/img/file.png'">
    <img class="ico" id="icon3" src="img/kamer.png" onerror="this.src='https://chatvideocall1.netlify.app/img/kamer.png'">
  </div>
  <img class="mic-foto" id="btnKirim" src="img/mix.png" onerror="this.src='https://chatvideocall1.netlify.app/img/mix.png'">
</div>

<div id="joinModal">
  <div class="join-card">
    <h3>Masuk Room</h3>
    <input id="room" value="ruang-tes-123">
    <input id="myName" placeholder="Nama kamu">
    <button id="join">Masuk</button>
  </div>
</div>

<script>
const APP_ID="cf22b9c1495d4cc89b36a9a81f9cfa16";
const TOKEN_URL="https://masguntoro-token.vercel.app";
let rtm, rtmCh, channelName="", myName="";
let rtcClient, localAudio, localVideoTrack;

function addMsg(t,cls){
  const div=document.createElement("div"); div.className="msg "+cls;
  div.innerHTML=`${t}<span class="time">${new Date().toLocaleTimeString().slice(0,5)}</span>`;
  document.getElementById("msgs").appendChild(div);
  document.getElementById("msgs").scrollTop=99999;
}
document.getElementById("join").onclick=async()=>{
  channelName=document.getElementById("room").value.trim();
  myName=document.getElementById("myName").value.trim()||"Saya";
  document.getElementById("joinModal").style.display="none";
  document.getElementById("roomTitle").innerText=channelName;
  addMsg("Kamu bergabung ke "+channelName,"me");
  rtm=AgoraRTM.createInstance(APP_ID);
  await rtm.login({uid:String(Math.floor(Math.random()*99999))});
  rtmCh=rtm.createChannel(channelName);
  await rtmCh.join();
  rtmCh.on("ChannelMessage",({text})=>{ const d=JSON.parse(text); addMsg(d.name+": "+d.msg,"you"); });
};
async function getToken(ch){
  try{ const r=await fetch(TOKEN_URL+"/api/rtc-token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({channelName:ch,uid:0})}); const d=await r.json(); return d.token||d.rtcToken; }catch(e){ return null; }
}
async function send(){
  const inp=document.getElementById("txt"); const t=inp.value.trim(); if(!t) return;
  addMsg("Kamu: "+t,"me"); inp.value=""; updateTombol();
  if(rtmCh) await rtmCh.sendMessage({text:JSON.stringify({name:myName,msg:t})});
}

// Tombol Atas
document.getElementById("top1").onclick=()=>location.reload();
async function startCall(video){
  const token=await getToken(channelName);
  rtcClient=AgoraRTC.createClient({mode:"rtc",codec:"vp8"});
  await rtcClient.join(APP_ID,channelName,token,null);
  localAudio=await AgoraRTC.createMicrophoneAudioTrack();
  await rtcClient.publish(localAudio);
  document.getElementById("callScreen").style.display="flex";
  if(video){
    localVideoTrack=await AgoraRTC.createCameraVideoTrack();
    localVideoTrack.play(document.getElementById("localVideo"));
    await rtcClient.publish(localVideoTrack);
  }
  rtcClient.on("user-published", async (user, mediaType)=>{
    await rtcClient.subscribe(user, mediaType);
    if(mediaType==="video"){ user.videoTrack.play(document.getElementById("remoteVideo")); }
    if(mediaType==="audio"){ user.audioTrack.play(); }
  });
}
document.getElementById("top3").onclick=()=>startCall(true);
document.getElementById("top4").onclick=()=>startCall(false);
document.getElementById("endCallBtn").onclick=async()=>{
  if(localAudio) localAudio.close(); if(localVideoTrack) localVideoTrack.close();
  if(rtcClient) await rtcClient.leave();
  document.getElementById("callScreen").style.display="none";
};
document.getElementById("top5").onclick=()=>alert("Room: "+channelName);

// Tombol Bawah + Anti Keluar Kolom
const txt=document.getElementById("txt");
const btn=document.getElementById("btnKirim");
const MIC_SRC="img/mix.png"; const SEND_SRC="img/kirim.png";
function updateTombol(){
  if(txt.value.trim().length>0){
    btn.src=SEND_SRC; btn.dataset.mode="send"; btn.style.background="#00a884";
  }else{
    btn.src=MIC_SRC; btn.dataset.mode="mic"; btn.style.background="#00a884";
  }
}
btn.onerror=function(){ this.src=btn.dataset.mode==="send" ? "https://cdn-icons-png.flaticon.com/512/786/786407.png" : "https://cdn-icons-png.flaticon.com/512/3602/3602145.png"; };
txt.addEventListener("input",updateTombol);
txt.addEventListener("keypress",e=>{ if(e.key==="Enter") send(); });
btn.addEventListener("click",()=>{ if(btn.dataset.mode==="send") send(); });

const emojiPanel=document.getElementById("emojiPanel");
const listEmoji=["😀","😂","😍","😭","😡","👍","🙏","❤️","🔥","🎉","😊","😅","🤣","😘","😎","🥳","🤔","🙄","😴","😁","🥰","😱","👏","💪"];
emojiPanel.innerHTML=listEmoji.map(e=>`<span>${e}</span>`).join("");
document.getElementById("icon1").onclick=()=>{ emojiPanel.style.display=emojiPanel.style.display==="block"?"none":"block"; };
emojiPanel.onclick=(e)=>{ if(e.target.tagName==="SPAN"){ txt.value+=e.target.innerText; txt.focus(); updateTombol(); } };
document.getElementById("icon2").onclick=()=>{ let i=document.createElement("input"); i.type="file"; i.onchange=ev=>{ let f=ev.target.files[0]; if(f) addMsg(`📎 File: <b>${f.name}</b>`,"me"); }; i.click(); };
document.getElementById("icon3").onclick=async()=>{
  try{
    let s=await navigator.mediaDevices.getUserMedia({video:true});
    let v=document.createElement("video"); v.srcObject=s; v.autoplay=true;
    v.style.cssText="position:fixed;inset:0;width:100%;height:100%;z-index:60;object-fit:cover;background:#000";
    document.body.appendChild(v);
    v.onclick=()=>{
      let c=document.createElement("canvas"); c.width=v.videoWidth; c.height=v.videoHeight;
      c.getContext("2d").drawImage(v,0,0); let url=c.toDataURL("image/jpeg",0.8);
      addMsg(`<img src="${url}" style="max-width:220px;border-radius:8px">`,"me");
      s.getTracks().forEach(t=>t.stop()); v.remove();
    };
  }catch(e){ alert("Kamera tidak diizinkan"); }
};
document.getElementById("msgs").onclick=()=>{ emojiPanel.style.display="none"; };
updateTombol();
</script>
</body>
</html>
